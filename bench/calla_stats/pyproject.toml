[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calla-stats"
version = "0.1.0"
description = "Confirmatory statistical inference protocol for wireless link adaptation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Adaptive AMC Authors"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "h5py>=3.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
calla-stats = "calla_stats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
